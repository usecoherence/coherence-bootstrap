name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      COHERENCE_DB_PROFILE: test
      COHERENCE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/download/v2.1.4/dolt_2.1.4_linux_amd64.tar.gz | tar xz
          sudo mv dolt_2.1.4_linux_amd64/dolt /usr/local/bin/
          sudo chmod +x /usr/local/bin/dolt
          dolt version
      - name: Start dolt
        run: |
          mkdir -p /run/user/1000/coherence
          nohup dolt sql-server \
            --data-dir /home/runner \
            --host 127.0.0.1 \
            --port 33306 \
            --socket /run/user/1000/coherence/dolt.sock \
            >>/tmp/dolt.log 2>&1 &
          echo "$!" > /tmp/dolt.pid
          sleep 3
          echo "Dolt started, pid: $(cat /tmp/dolt.pid)"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: make test-isolated
      - run: make tool check-policy
