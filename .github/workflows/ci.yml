name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      COHERENCE_DB_PROFILE: test
      COHERENCE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version
      - name: Start dolt
        run: |
          mkdir -p /tmp/coherence
          nohup dolt sql-server \
            --data-dir /tmp \
            --host 127.0.0.1 \
            --port 33306 \
            --socket /tmp/coherence/dolt.sock \
            >>/tmp/dolt.log 2>&1 &
          echo "$!" > /tmp/dolt.pid
          sleep 3
          echo "Dolt started, pid: $(cat /tmp/dolt.pid)"
          echo "DOLT_SOCKET=/tmp/coherence/dolt.sock" >> $GITHUB_ENV
          echo "DOLT_PORT=33306" >> $GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: make test-isolated CARGO_TEST_ARGS="-- --test-threads=1"
      - run: make tool check-policy
