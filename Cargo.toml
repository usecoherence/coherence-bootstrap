[package]
name = "coherence-core-db-bootstrap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[workspace]
members = ["crates/coherence-code-quality", "crates/coherence-core-db", "crates/coherence-core-db-tui"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.76"
authors = ["Nikolai Konovalov"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# assert!(x.is_empty()) reads better than assert_eq!(x, Vec::new()).
assert_is_empty = "allow"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
toml = "0.8.19"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
coherence-code-quality = { path = "crates/coherence-code-quality" }
coherence-core-db = { path = "crates/coherence-core-db" }
coherence-core-db-tui = { path = "crates/coherence-core-db-tui" }
