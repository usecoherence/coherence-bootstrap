[package]
name = "coherence-core-db-bootstrap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "coherence-bootstrap"
path = "src/main.rs"

[workspace]
members = ["crates/coherence-core-db", "crates/coherence-core-db-tui", "crates/coherence-test-world"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.76"
authors = ["Nikolai Konovalov"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
toml = "0.8.19"

[dependencies]
coherence-core-db = { path = "crates/coherence-core-db" }
coherence-core-db-tui = { path = "crates/coherence-core-db-tui" }

[dev-dependencies]
coherence-test-world = { path = "crates/coherence-test-world" }
