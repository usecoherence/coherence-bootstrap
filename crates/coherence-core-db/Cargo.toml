[package]
name = "coherence-core-db"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Coherence core DB lifecycle and schema tool"

[lints]
workspace = true

[dependencies]
# Align with refinery’s `mysql` (<=26) so `mysql::Conn` is one type for CLI + embedded migrations.
mysql = "26.0.1"
refinery = { version = "0.9.1", features = ["mysql"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.128"
toml.workspace = true
sha2 = "0.10.8"
uuid = { version = "1.10.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10.1"
